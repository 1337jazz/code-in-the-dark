<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <link rel="stylesheet" href="/styles/overlay.css">
    <style>
      body {
        margin: 0;
      }

      #result {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background-color: white;
      }
    </style>
  </head>
  <body>
    <iframe id="result"></iframe>
    <div class="name-tag"></div>

    <script>
      // Show the saved editor content and the contestant name
      document.querySelector("#result").srcdoc = localStorage["content"] ?? "";
      document.querySelector(".name-tag").textContent = localStorage["name"] ?? "";
    </script>
  </body>
</html>
