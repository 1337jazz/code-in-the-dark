<!DOCTYPE html>
<html lang="">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Code in the Dark</title>
</head>

<body>
	<iframe id="preview" frameborder="0"></iframe>
	<button id="switch">Switch</button>
	<script>

		// Get the preview element
		const $preview = document.querySelector("#preview");

		// Get the switch button
		const $switch = document.querySelector("#switch");

		// Create a function to update the preview
		const update = () => ($preview.srcdoc = localStorage["content"] ?? "");

		// And do an initial update
		update();

		// Begin listening for storage changes
		window.addEventListener("storage", (e) => e.key === "content" && update());


		// And add a click handler to the switch button
		$switch.addEventListener("click", () => {
			// switch back to the editor
			location.href = "/";
		});



	</script>
</body>

<style>
	/* Minimal CSS to overrride the default iframe styles so we get a true representation from the editor*/
	body {
		margin: 0;
	}

	#preview {
		display: block;
		background: white;
		width: 100%;
		height: 100vh;
		border: 0;
	}

	#switch {
		position: fixed;
		bottom: 0;
		right: 0;
		padding: 1rem;
		background: white;
		border: 0;
		z-index: 100;
	}
</style>

</html>
